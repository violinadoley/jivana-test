services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: development
      AUTH_REQUIRED: "false"
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/app:/app/app:ro
