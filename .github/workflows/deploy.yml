# MANUAL SETUP REQUIRED: GitHub environment "gcp", GCP project, WIF, Artifact Registry, Cloud Run.
# See docs/setup/github-google-oidc.md and docs/deployment/cloud-run.md

name: Deploy API

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: write

env:
  SERVICE_NAME: ai-hackathon-api
  IMAGE_NAME: ai-hackathon-api

jobs:
  deploy:
    # Skips until GitHub Variables are set (see docs/setup/github-google-oidc.md).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: gcp
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate required variables
        run: |
          set -euo pipefail
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT GCP_ARTIFACT_REPO; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing repository variable $v (Settings → Secrets and variables → Actions → Variables)."
              exit 1
            fi
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}

      - id: auth
        name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          CORS_ORIGINS="http://localhost:3000,https://${{ vars.GCP_PROJECT_ID }}.web.app,https://${{ vars.GCP_PROJECT_ID }}.firebaseapp.com"
          FIREBASE_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}"
          if [ -z "$FIREBASE_STORAGE_BUCKET" ]; then
            FIREBASE_STORAGE_BUCKET="${FIREBASE_PROJECT_ID}.firebasestorage.app"
          fi
          AUTH_REQUIRED="${{ vars.AUTH_REQUIRED }}"
          if [ -z "$AUTH_REQUIRED" ]; then
            AUTH_REQUIRED="false"
          fi
          ENV_FILE="$(mktemp)"
          {
            echo "ENVIRONMENT: cloud"
            echo "APP_VERSION: 1.0.0"
            echo "GIT_SHA: ${{ github.sha }}"
            echo "GEMINI_MODEL: gemini-2.5-flash"
            echo "AUTH_REQUIRED: \"${AUTH_REQUIRED}\""
            echo "CORS_ORIGINS: ${CORS_ORIGINS}"
            echo "FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}"
            echo "FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}"
            echo "GCP_PROJECT_ID: ${FIREBASE_PROJECT_ID}"
            echo "GCP_LOCATION: ${{ vars.GCP_REGION }}"
            echo "DOCUMENT_AI_PROCESSOR_ID: ${{ vars.DOCUMENT_AI_PROCESSOR_ID }}"
            echo "DOCUMENT_AI_LOCATION: ${{ vars.DOCUMENT_AI_LOCATION }}"
            echo "VERTEX_GEMINI_MODEL: gemini-2.5-flash"
          } > "$ENV_FILE"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --concurrency 80 \
            --env-vars-file "$ENV_FILE" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest"

      - name: Smoke test API
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "API_BASE_URL=$URL" >> "$GITHUB_ENV"
          chmod +x scripts/smoke-api.sh
          API_BASE_URL="$URL" scripts/smoke-api.sh

      - name: Publish live API link for the team
        id: publish_api_link
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOCS_URL="${API_BASE_URL}/docs"
          gh variable set BACKEND_API_URL --body "$DOCS_URL" --repo "${{ github.repository }}"
          echo "::notice title=Backend API (Swagger)::${DOCS_URL}"

      - name: API link fallback hint
        if: steps.publish_api_link.outcome == 'failure'
        run: |
          echo "::warning::Could not set BACKEND_API_URL in Actions (403). Run: ./scripts/set-github-repo-links.sh \"https://\${GCP_PROJECT_ID}.web.app\" \"${API_BASE_URL}/docs\""
