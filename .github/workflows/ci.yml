name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest (backend)
        run: pytest -q
        env:
          GEMINI_API_KEY: test-key-not-used
      - name: Pip audit
        run: pip-audit -r requirements.txt
      - name: Bandit
        run: bandit -r app -ll -q

  ai-evals:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: AI eval regression (framework)
        run: pytest ai-evals/regression -q
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: npm audit (production, high+)
        run: node ../scripts/check-npm-audit-prod.mjs

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build (for next start)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block obvious secret filenames
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.local$|service-account\.json|credentials\.json|.*\.pem$|.*\.key$)'; then
            echo "Forbidden secret-like files are tracked in git."
            exit 1
          fi
          echo "No forbidden secret filenames tracked."
      - name: Gitleaks (content scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
